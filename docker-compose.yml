# Sobe o n8n e o robô do Monitor de Uptime juntos.
#   cp "Monitor uptime/bot/.env.example" "Monitor uptime/bot/.env"   (e preencha)
#   docker compose up -d
# n8n em http://localhost:5678 (importe os workflows .json pela interface)
services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Fortaleza
      - TZ=America/Fortaleza
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  uptime-bot:
    build: ./Monitor uptime
    env_file: ./Monitor uptime/bot/.env
    depends_on:
      - n8n
    restart: unless-stopped

volumes:
  n8n_data:
